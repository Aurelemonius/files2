<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ładowanie treści z innego pliku</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            margin: 40px;
            background-color: #f8f9fa;
        }
        button {
            padding: 12px 20px;
            font-size: 1.1rem;
            background-color: #636e72;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        button:hover {
            background-color: #2d3436;
        }
        #zawartosc {
            margin-top: 30px;
            padding: 25px;
            background: white;
            border-radius: 12px;
            border: 1px solid #ddd;
            min-height: 150px;
        }
    </style>
</head>
<body>

    <h1>Główna strona</h1>
    <p>Kliknij przycisk, aby wczytać wiadomość z innego pliku:</p>
    
    <button onclick="pobierzWiadomosc()">Wczytaj "Hello World"</button>
    
    <div id="zawartosc">
    </div>

    <script>
        function pobierzWiadomosc() {
            fetch('message.html')
                .then(response => {
                    if (!response.ok) throw new Error('Nie udało się pobrać pliku');
                    return response.text();
                })
                .then(data => {
                    document.getElementById('zawartosc').innerHTML = data;
                })
                .catch(error => {
                    document.getElementById('zawartosc').innerHTML = 
                        `<p style="color: red;">Błąd: ${error.message}</p>`;
                });
        }
    </script>

</body>
</html>
